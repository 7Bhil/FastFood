<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />
    <meta name="description" content="SellExpress - Application de livraison de nourriture locale au Bénin" />
    <meta name="keywords" content="livraison, nourriture, restaurant, Bénin, Cotonou, Parakou" />
    <meta name="author" content="SellExpress Team" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SellExpress" />
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#f97316" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="SellExpress - Livraison de Nourriture" />
    <meta property="og:description" content="Découvrez les meilleurs restaurants près de chez vous au Bénin" />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    <meta property="og:url" content="https://sellexpress.bj" />
    <meta property="og:type" content="website" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SellExpress - Livraison de Nourriture" />
    <meta name="twitter:description" content="Découvrez les meilleurs restaurants près de chez vous au Bénin" />
    <meta name="twitter:image" content="/icons/icon-512x512.png" />
    
    <title>SellExpress - Livraison de Nourriture</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Service Worker pour PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
